# .github/workflows/ci.yml

name: 'Qwen Code CI'

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - 'main'
  workflow_dispatch:

concurrency:
  group: '${{ github.workflow }}-${{ github.head_ref || github.ref }}'
  cancel-in-progress: "${{ github.ref != 'refs/heads/main' }}"

permissions:
  contents: 'read'

defaults:
  run:
    shell: 'bash'

jobs:
  test:
    name: 'Build, lint, typecheck and test'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 90
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10' # v6.0.3
        with:
          persist-credentials: false

      - name: 'Set up Node.js 22.x'
        uses: 'actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e' # v6.4.0
        with:
          node-version: '22.x'
          package-manager-cache: false

      # Real-tmux capture tests skip without tmux; the zip-packaging suite
      # needs zip/unzip.
      - name: 'Install tmux and zip tooling'
        run: |-
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends tmux zip unzip

      - name: 'Install dependencies'
        run: 'corepack pnpm install --frozen-lockfile'

      - name: 'Build'
        run: 'npm run build'

      - name: 'Lint'
        run: 'npm run lint'

      - name: 'Typecheck'
        run: 'npm run typecheck'

      - name: 'Check lockfile'
        run: 'npm run check:lockfile'

      - name: 'Check i18n'
        run: 'npm run check-i18n'

      - name: 'Unit tests'
        env:
          NO_COLOR: true
          HOME: '${{ runner.temp }}/qwen-ci-home'
        run: |-
          mkdir -p "$HOME"
          npm run test:ci:workspaces

      - name: 'Script tests'
        env:
          NO_COLOR: true
        run: 'npm run test:scripts'
